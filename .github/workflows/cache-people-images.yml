name: Cache people images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-people-images.yml'

permissions:
  contents: write

jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download portraits into repository
        shell: bash
        run: |
          set -u
          mkdir -p assets/people

          fetch_img() {
            url="$1"
            dest="$2"
            referer="$3"
            echo "Fetching $dest"
            if curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
              -e "$referer" -fsS "$url" -o "$dest.tmp"; then
              if file "$dest.tmp" | grep -Eqi 'JPEG|PNG|WebP|image'; then
                mv "$dest.tmp" "$dest"
              else
                echo "Not an image: $url"
                rm -f "$dest.tmp"
              fi
            else
              echo "Download failed: $url"
              rm -f "$dest.tmp"
            fi
          }

          fetch_img 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Shing-Tung_Yau.jpg' 'assets/people/yau.jpg' 'https://commons.wikimedia.org/'
          fetch_img 'https://www.bimsa.cn/upload/img/avatar/rlwu_J1yxp.jpg' 'assets/people/rongling-wu.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/MingmingSun_fM7cY.jpeg' 'assets/people/mingming-sun.jpeg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/avatar/zwang_90Aqr.jpg' 'assets/people/zhong-wang.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/YaqingWang_ufizi.JPG' 'assets/people/yaqing-wang.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/XinZhao_NRpBd.png' 'assets/people/xin-zhao.png' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/avatar/jshao_la1yq.jpg' 'assets/people/jiajia-shao.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/wushuang_tJdbV.jpg' 'assets/people/shuang-wu.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/jingyanli_wiV3o.jpg' 'assets/people/jingyan-li.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://bimsa.net/img/people/IDPhoto/congweisong.jpg' 'assets/people/congwei-song.jpg' 'https://bimsa.net/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/haihuaxie_32Hi1.JPG' 'assets/people/haihua-xie.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/songjiebo_0BJRP.jpg' 'assets/people/jiebo-song.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/avatar/lpzhang_62aNp.jpg' 'assets/people/liping-zhang.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/miaohe_9Mxqe.jpg' 'assets/people/miao-he.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://www.bimsa.cn/upload/img/img/people/avatar_panel/QiFeng_Jylii.jpg' 'assets/people/qi-feng.jpg' 'https://www.bimsa.cn/'
          fetch_img 'https://mayuan.bucea.edu.cn/images/2025-05/95f30a06ba2f454ebb7e6d4f462e9c05.jpeg' 'assets/people/lingyong-guan.jpeg' 'https://mayuan.bucea.edu.cn/'
          fetch_img 'https://faculty.bucea.edu.cn/pub/zhanghang/images/202303311939103910.JPG' 'assets/people/hang-zhang.jpg' 'https://faculty.bucea.edu.cn/'
          fetch_img 'https://mayuan.bucea.edu.cn/images/2025-05/8638c5ff6e8c4d7ab020539e864b51f9.jpeg' 'assets/people/qiongzhi-wang.jpeg' 'https://mayuan.bucea.edu.cn/'

      - name: Point organization page at local assets
        shell: python
        run: |
          from pathlib import Path

          p = Path('org-structure.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/Shing-Tung_Yau.jpg': './assets/people/yau.jpg',
              'https://www.bimsa.cn/upload/img/avatar/rlwu_J1yxp.jpg': './assets/people/rongling-wu.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/MingmingSun_fM7cY.jpeg': './assets/people/mingming-sun.jpeg',
              'https://www.bimsa.cn/upload/img/avatar/zwang_90Aqr.jpg': './assets/people/zhong-wang.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/YaqingWang_ufizi.JPG': './assets/people/yaqing-wang.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/XinZhao_NRpBd.png': './assets/people/xin-zhao.png',
              'https://www.bimsa.cn/upload/img/avatar/jshao_la1yq.jpg': './assets/people/jiajia-shao.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/wushuang_tJdbV.jpg': './assets/people/shuang-wu.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/jingyanli_wiV3o.jpg': './assets/people/jingyan-li.jpg',
              'https://bimsa.net/img/people/IDPhoto/congweisong.jpg': './assets/people/congwei-song.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/haihuaxie_32Hi1.JPG': './assets/people/haihua-xie.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/songjiebo_0BJRP.jpg': './assets/people/jiebo-song.jpg',
              'https://www.bimsa.cn/upload/img/avatar/lpzhang_62aNp.jpg': './assets/people/liping-zhang.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/miaohe_9Mxqe.jpg': './assets/people/miao-he.jpg',
              'https://www.bimsa.cn/upload/img/img/people/avatar_panel/QiFeng_Jylii.jpg': './assets/people/qi-feng.jpg',
              'https://mayuan.bucea.edu.cn/images/2025-05/95f30a06ba2f454ebb7e6d4f462e9c05.jpeg': './assets/people/lingyong-guan.jpeg',
              'https://faculty.bucea.edu.cn/pub/zhanghang/images/202303311939103910.JPG': './assets/people/hang-zhang.jpg',
              'https://mayuan.bucea.edu.cn/images/2025-05/8638c5ff6e8c4d7ab020539e864b51f9.jpeg': './assets/people/qiongzhi-wang.jpeg',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # User-provided local portrait for Su Weidong.
          s = s.replace(
              '<article class="faculty-card"><div class="org-avatar"><span class="org-avatar-fallback">苏</span></div><h3>苏伟栋</h3><p>任职教师</p></article>',
              '<article class="faculty-card"><div class="org-avatar"><img src="./assets/people/suweidong.svg" alt="苏伟栋" /><span class="org-avatar-fallback" hidden>苏</span></div><h3>苏伟栋</h3><p>任职教师</p></article>'
          )
          p.write_text(s, encoding='utf-8')

      - name: Commit cached portraits
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/people org-structure.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Cache organization portraits locally'
            git push
          fi
